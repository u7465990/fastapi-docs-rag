[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-docs-rag"
version = "0.1.0"
description = "Version-aware RAG over FastAPI documentation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ricky Du" }]
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "qdrant-client>=1.15",
    "redis>=6.0",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rag = [
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "fastembed>=0.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
    "mypy>=1.15",
]

[project.scripts]
fastapi-docs-rag-serve = "fastapi_docs_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# 默认走清华镜像（国内直连 pypi.org 会超时）。海外环境或镜像故障时：
#   uv lock --default-index https://pypi.org/simple
#   uv sync --default-index https://pypi.org/simple
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["fastapi_docs_rag"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"
